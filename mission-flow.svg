<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="390" viewBox="0 0 1500 390" role="img" aria-labelledby="t d">
<title id="t">MissionCart shopping journey</title><desc id="d">Six-step customer journey from describing a goal through product discovery, budget planning, cart, payment verification and order tracking.</desc>
<defs><style>.head{font:700 25px Inter,Arial;fill:#2B2220}.body{font:15px Inter,Arial;fill:#6A5D56}.num{font:700 16px Inter,Arial;fill:#fff}</style><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3L0 6" fill="#C69B6D"/></marker></defs>
<rect width="1500" height="390" rx="24" fill="#F8F3EC"/><text x="60" y="62" font-family="Georgia,serif" font-size="38" fill="#2B2220">From a life plan to a considered purchase.</text>
<g transform="translate(60 120)">
<g><rect width="205" height="185" rx="18" fill="#E7C8D0"/><circle cx="32" cy="32" r="17" fill="#7F2548"/><text x="32" y="38" text-anchor="middle" class="num">1</text><text x="24" y="88" class="head">Describe</text><text x="24" y="119" class="body">Share your goal,</text><text x="24" y="143" class="body">needs and budget.</text></g>
<path d="M215 92H245" stroke="#C69B6D" stroke-width="3" marker-end="url(#a)"/>
<g transform="translate(255)"><rect width="205" height="185" rx="18" fill="#F0E7DA"/><circle cx="32" cy="32" r="17" fill="#7F2548"/><text x="32" y="38" text-anchor="middle" class="num">2</text><text x="24" y="88" class="head">Understand</text><text x="24" y="119" class="body">Interpret intent and</text><text x="24" y="143" class="body">identify requirements.</text></g>
<path d="M470 92H500" stroke="#C69B6D" stroke-width="3" marker-end="url(#a)"/>
<g transform="translate(510)"><rect width="205" height="185" rx="18" fill="#E6E9DF"/><circle cx="32" cy="32" r="17" fill="#7F2548"/><text x="32" y="38" text-anchor="middle" class="num">3</text><text x="24" y="88" class="head">Discover</text><text x="24" y="119" class="body">Retrieve relevant,</text><text x="24" y="143" class="body">verified catalogue items.</text></g>
<path d="M725 92H755" stroke="#C69B6D" stroke-width="3" marker-end="url(#a)"/>
<g transform="translate(765)"><rect width="205" height="185" rx="18" fill="#F1E3E7"/><circle cx="32" cy="32" r="17" fill="#7F2548"/><text x="32" y="38" text-anchor="middle" class="num">4</text><text x="24" y="88" class="head">Plan</text><text x="24" y="119" class="body">Compare options and</text><text x="24" y="143" class="body">recalculate the budget.</text></g>
<path d="M980 92H1010" stroke="#C69B6D" stroke-width="3" marker-end="url(#a)"/>
<g transform="translate(1020)"><rect width="205" height="185" rx="18" fill="#E8D9C6"/><circle cx="32" cy="32" r="17" fill="#7F2548"/><text x="32" y="38" text-anchor="middle" class="num">5</text><text x="24" y="88" class="head">Purchase</text><text x="24" y="119" class="body">Check out with the</text><text x="24" y="143" class="body">actual seller or gateway.</text></g>
<path d="M1235 92H1265" stroke="#C69B6D" stroke-width="3" marker-end="url(#a)"/>
<g transform="translate(1275)"><rect width="165" height="185" rx="18" fill="#7F2548"/><circle cx="32" cy="32" r="17" fill="#F3EDE3"/><text x="32" y="38" text-anchor="middle" style="font:700 16px Inter,Arial;fill:#7F2548">6</text><text x="20" y="88" style="font:700 23px Inter,Arial;fill:#fff">Track</text><text x="20" y="119" style="font:15px Inter,Arial;fill:#F3EDE3">Follow order and</text><text x="20" y="143" style="font:15px Inter,Arial;fill:#F3EDE3">product lifecycle.</text></g>
</g></svg>
